[project]
name = "arandu-motor"
version = "0.1.0"
description = "Arandu M1: motor de execução em sandbox e ferramentas (MCP + REST) do treinador de depuração"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "typing_extensions>=4.6; python_version < '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arandu-motor = "arandu_motor.servidor:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arandu_motor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
